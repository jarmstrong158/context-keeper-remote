name = "context-keeper-remote"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Structured logs (see src/log.ts) to Workers Logs: Workers & Pages ->
# context-keeper-remote -> Logs. Without this the console.log lines never reach
# the dashboard, so the next dropped handshake could not be diagnosed there.
# Declared per-env below as well, since CI deploys `--env production`.
[observability]
enabled = true

# --- D1 binding (default env) ----------------------------------------------
# No `database_id` on purpose. This is what the "Deploy to Cloudflare" button
# and `wrangler dev`/`wrangler deploy` (without --env) read. With the id
# omitted, Cloudflare AUTO-PROVISIONS a fresh D1 database in the deploying
# user's account and binds it here (auto-provisioning: wrangler >= 4.45.0).
# So a one-click self-hoster gets their own database with no manual setup.
# Local vitest also uses this binding, backed by an in-memory workerd D1.
[[d1_databases]]
binding = "DB"
database_name = "context-keeper"


# --- cambium-remote service binding ----------------------------------------
# The Knowledge panel reads cambium-remote's /status route. It CANNOT do that
# with a plain fetch to https://cambium-remote.<account>.workers.dev: Cloudflare
# does not route a Worker subrequest to a workers.dev hostname, and the edge
# answers 404 without the target Worker ever running. That failure is
# indistinguishable from "wrong token" from the caller's side -- the target's
# own logs show no request at all, which is the only way to tell.
#
# A service binding is the supported mechanism. It dispatches in-process, so
# there is no DNS, no TLS, no egress, and no extra latency. The request still
# arrives at cambium-remote's normal fetch handler and is still checked against
# STATUS_TOKEN, so the credential separation is unchanged -- the binding
# replaces the transport, not the authorization.
[[services]]
binding = "CAMBIUM"
service = "cambium-remote"

# --- production env (this repo's own CI) -----------------------------------
# The maintainer's GitHub Actions deploy runs `wrangler deploy --env production`
# and pins the existing D1 by id, so CI keeps deploying to the same database and
# the same Worker name/URL. Self-hosters never use this env.
[env.production]
name = "context-keeper-remote"

# Named environments do not inherit the top-level [observability], so repeat it
# here -- this is the env CI actually deploys (`wrangler deploy --env production`).
[env.production.observability]
enabled = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "context-keeper"
database_id = "4ed77245-807b-4fa8-a50d-c71cfd3c704d"

# AUTH_TOKEN is NOT declared here. It is a secret, set in the dashboard:
# Worker -> Settings -> Variables and Secrets -> add AUTH_TOKEN. Keeping it out
# of source and out of Git is intentional; the connector URL embeds it.

# Named environments inherit nothing, so the binding is repeated for the env CI
# actually deploys.
[[env.production.services]]
binding = "CAMBIUM"
service = "cambium-remote"
